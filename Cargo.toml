[package]
name = "udd"
version = "0.1.0"
edition = "2021"
description = "Access to the Ultimate Debian Database (UDD)"
license = "Apache-2.0"
repository = "https://github.com/jelmer/udd-rs"
authors = ["Jelmer Vernooĳ <jelmer@debian.org>"]
keywords = ["debian", "udd", "database"]
categories = ["database"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
debversion = { version = "0.5.5", features = ["sqlx"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
sqlx = { version = "0.9.1", default-features = false, features = ["postgres", "derive", "chrono", "json", "rust_decimal"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["runtime-tokio"]
runtime-tokio = ["sqlx/runtime-tokio"]
runtime-async-std = ["sqlx/runtime-async-std"]
tls-rustls = ["sqlx/tls-rustls"]
tls-native-tls = ["sqlx/tls-native-tls"]
serde = ["dep:serde", "debversion/serde", "chrono/serde", "rust_decimal/serde"]
